<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HITTA CLIP - Signing In</title>
  <style>
    body {
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      display: grid;
      place-items: center;
      min-height: 90vh;
      text-align: center;
    }
  </style>
</head>
<body>
  <div>
    <h2>HITTA CLIP</h2>
    <p id="message">Completing Google sign-in...</p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const error = params.get('error_description') || params.get('error');

    const message = {
      type: 'HITTA_AUTH_CALLBACK',
      code: code,
      error: error
    };

    if (window.opener && !window.opener.closed) {
      window.opener.postMessage(
        message,
        'https://html-classic.itch.zone'
      );

      document.getElementById('message').textContent =
        error ? 'Sign-in failed. You can close this window.' :
        'Sign-in complete! You can close this window.';

      setTimeout(() => window.close(), 1200);
    } else {
      document.getElementById('message').textContent =
        'Could not connect to the game. Please return to HITTA CLIP.';
    }
  </script>
</body>
</html>
