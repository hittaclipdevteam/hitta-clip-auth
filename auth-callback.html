<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HITTA CLIP - Signing In</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    main { padding: 24px; }
    h2 { margin-bottom: 10px; }
    p { opacity: .85; }
  </style>
</head>
<body>
  <main>
    <h2>HITTA CLIP</h2>
    <p id="message">Completing Google sign-in...</p>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
    const code = params.get('code') || hashParams.get('code');
    const error = params.get('error_description') || params.get('error') ||
                  hashParams.get('error_description') || hashParams.get('error');

    const message = document.getElementById('message');

    if (window.opener && !window.opener.closed) {
      window.opener.postMessage(
        { type: 'HITTA_AUTH_CALLBACK', code, error },
        'https://html-classic.itch.zone'
      );

      message.textContent = error
        ? 'Sign-in could not be completed. Returning to the game...'
        : code
          ? 'Sign-in complete! Returning to the game...'
          : 'Could not complete sign-in. Returning to the game...';

      window.setTimeout(() => window.close(), 1200);
    } else {
      message.textContent = 'Please return to HITTA CLIP.';
    }
  </script>
</body>
</html>
